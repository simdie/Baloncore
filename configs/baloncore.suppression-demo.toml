[project]
name = "baloncore-lab-suppression-demo"
description = "Authorized local target for testing BALONCORE suppression rules."
tags = ["api", "web"]

[scope]
allow_urls = ["http://localhost:3000"]
allow_hosts = ["localhost", "127.0.0.1"]
deny_hosts = []
max_depth = 3

[[auth_profiles]]
name = "anonymous"
role = "anonymous"
description = "Unauthenticated baseline."
object_markers = []

[[auth_profiles]]
name = "user_a"
role = "user"
description = "Standard low-privilege user."
object_markers = ["user_a"]

[auth_profiles.credential]
bearer_token_env = "BALONCORE_USER_A_TOKEN"

[[auth_profiles]]
name = "user_b"
role = "user"
description = "Second low-privilege user for cross-account checks."
object_markers = ["user_b", "user_b@example.test"]

[auth_profiles.credential]
bearer_token_env = "BALONCORE_USER_B_TOKEN"

[[auth_profiles]]
name = "admin"
role = "admin"
description = "Administrative control profile."
object_markers = ["admin"]

[auth_profiles.credential]
bearer_token_env = "BALONCORE_ADMIN_TOKEN"

[engines]
web_api = true
cloud_iam = false
web3 = false

[[suppressions]]
id = "demo-approved-invoice-support-access"
reason = "Demo rule proving that documented approved access can be suppressed."
endpoint = "GET /api/invoices/{id}"
classification = "broken_object_level_authorization"
profile = "user_a"
role = "user"
object_id = "inv_2002"
expires = "2026-12-31"
